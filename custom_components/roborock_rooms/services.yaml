clean_rooms:
  name: Clean rooms
  description: Start a segment clean of one or more rooms on a Roborock vacuum.
  fields:
    device_id:
      name: Device
      description: The Roborock vacuum to clean.
      required: true
      selector:
        device:
          integration: roborock_rooms
          model: Vacuum
    segments:
      name: Segments
      description: List of room segment ids to clean, e.g. [2, 5]. See the room sensors' state/attributes.
      required: true
      selector:
        object:
    repeat:
      name: Repeat
      description: Number of times to clean each room (1-3). Leave empty to use each room's own repeat setting.
      required: false
      selector:
        number:
          min: 1
          max: 3
          mode: box
    use_room_settings:
      name: Use room settings
      description: >-
        Clean each room with its own suction, water flow, mop route and repeat settings. Rooms
        with different settings are cleaned one group at a time. Turn off to clean everything
        with the vacuum's current settings.
      required: false
      default: true
      selector:
        boolean:
run_routine:
  name: Run routine
  description: Trigger a Roborock routine (scene) defined in the Roborock app.
  fields:
    device_id:
      name: Device
      description: The Roborock vacuum the routine belongs to.
      required: true
      selector:
        device:
          integration: roborock_rooms
          model: Vacuum
    routine_id:
      name: Routine
      description: The routine id to run. See the routine buttons' attributes, or the integration diagnostics.
      required: true
      selector:
        object:
