clean_rooms:
  name: Clean rooms
  description: Start a segment clean of one or more rooms on a Roborock vacuum.
  fields:
    device_id:
      name: Device
      description: The Roborock vacuum to clean.
      required: true
      selector:
        device:
          integration: roborock_rooms
    segments:
      name: Segments
      description: List of room segment ids to clean, e.g. [2, 5]. See the room sensors' state/attributes.
      required: true
      selector:
        object:
    repeat:
      name: Repeat
      description: Number of times to clean each room (1-3).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
