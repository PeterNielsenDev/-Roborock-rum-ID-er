clean_rooms:
  name: Clean rooms
  description: Start a segment clean of one or more rooms on a Roborock vacuum.
  fields:
    duid:
      name: Device ID
      description: The vacuum's device id (duid), as shown on any of its room sensor attributes.
      required: true
      selector:
        text:
    segments:
      name: Segments
      description: List of room segment ids to clean, e.g. [2, 5].
      required: true
      selector:
        object:
    repeat:
      name: Repeat
      description: Number of times to clean each room (1-3).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
